<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ room_name }} Booking</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body><header class="top"><a class="brand" href="/"><span class="brandmark">C</span><span>SPACE<span class="muted"> / BOOKING</span></span></a><a href="/admin/login" class="adminlink">Admin</a></header>
<main class="wrap">{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}{% for category,message in messages %}<div class="notice {{category}}">{{message}}</div>{% endfor %}{% endif %}{% endwith %}{% block content %}{% endblock %}</main>
<footer>Simple room booking · {{ room_name }}</footer></body></html>
